[project]
name = "mice-protein-expression-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas", email = "lucasalonso@id.uff.br" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
mice-protein-expression-ml = "mice_protein_expression_ml:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
